    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1a2f;

            align-items: center;

            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: radial-gradient(circle at 30% 40%, rgba(18, 40, 70, 0.5) 0%, transparent 50%);
            position: relative;
            overflow-x: hidden;
        }

        @keyframes intenseGlow {
            0% { text-shadow: 0 0 5px #2ecc71, 0 0 10px #2ecc71; opacity: 0.9; }
            50% { text-shadow: 0 0 20px #2ecc71, 0 0 35px #3498db, 0 0 50px #2ecc71; opacity: 1; }
            100% { text-shadow: 0 0 5px #2ecc71, 0 0 10px #2ecc71; opacity: 0.9; }
        }

        @keyframes borderPulse {
            0% { border-color: rgba(46, 204, 113, 0.4); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.2); }
            50% { border-color: rgba(46, 204, 113, 1); box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.6), 0 0 25px rgba(46, 204, 113, 0.5); }
            100% { border-color: rgba(46, 204, 113, 0.4); box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.2); }
        }

        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(135deg, #07121f, #0a1a2a);
            border-bottom: 2px solid #2ecc71;
            padding: 20px 0 14px 0;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.3);
        }

        .header-inner {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 24px;
        }

        .site-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff, #b0e0ff, #88aaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: intenseGlow 2s infinite;
        }

        .site-title span {
            font-size: 1.9rem;
            display: inline-block;
        }

        .server-badge {
            background: #0e1f2e;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: monospace;
            color: #b8e2ff;
            border: 1px solid #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
            animation: borderPulse 2s infinite;
        }

        @media (max-width: 550px) {
            .header-inner { padding: 0 16px; }
            .site-title { font-size: 1.3rem; }
            .server-badge { font-size: 0.7rem; padding: 5px 12px; }
        }

        .main-wrapper {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            margin-top: 110px;
        }

        .bg-animated {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            animation: bgPulse 6s infinite;
        }
        .bg-circle:nth-child(1) { width: 300px; height: 300px; background: #2ecc71; top: -80px; left: -60px; }
        .bg-circle:nth-child(2) { width: 250px; height: 250px; background: #3498db; bottom: -70px; right: -50px; animation-delay: 1.5s; }
        .bg-circle:nth-child(3) { width: 180px; height: 180px; background: #2ecc71; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 3s; }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1); opacity: 0.05; }
            50% { transform: scale(1.2); opacity: 0.1; }
        }

        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: floatUp 8s infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(2.5); opacity: 0; }
        }

        .app-screen {
            width: 100%;
            background: #0d1f35;
            border-radius: 40px;
            padding: 40px 28px 44px;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            border: 1px solid rgba(24, 50, 80, 0.7);
            position: relative;
            z-index: 2;
            animation: borderPulse 2s infinite;
        }

        .greeting-container { text-align: center; }

        .main-title {

            font-weight: 600;
            color: #eef5ff;
            text-transform: uppercase;
        }
        .main-title .highlight {

        }

            color: #aac8e4;
            text-transform: uppercase;

        .form-container { width: 100%; display: flex; flex-direction: column; gap: 14px; }
        .input-label, .select-label { font-size: 0.8rem; color: #7a9bbd; padding-left: 10px; }

        .input-field, .select-field {
            width: 100%;
            background: #0f2340;

            border-radius: 18px;
            padding: 15px 18px;

            font-size: 1rem;

        .input-field:focus, .select-field:focus {

        .send-btn {

            border: 1px solid #2ecc71;
            border-radius: 30px;
            padding: 14px;
            color: #e0ecf8;
            font-size: 1.1rem;
            font-weight: bold;

            transition: 0.2s;

        .send-btn:hover {

            box-shadow: 0 0 25px #2ecc71;

        .method-buttons-row { display: flex; gap: 12px; width: 100%; }
        .method-btn {

            background: #0f2340;
            border: 1px solid #2ecc71;
            border-radius: 22px;
            padding: 12px 8px;
            color: #b2cbe4;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;

        .method-btn:hover {

            box-shadow: 0 0 15px #2ecc71;

        .separator { width: 70px; height: 2px; background: linear-gradient(90deg, transparent, #2ecc71, #3498db, transparent); margin: 10px 0; }

        .footer-note {

            text-align: center;

            color: #aaffdd;
            text-shadow: 0 0 8px #2ecc71, 0 0 5px #2ecc71;

            bottom: 90px;
            right: 25px;
            width: 48px;
            height: 48px;
            background: #0f1a2a;
            border: 2px solid #2ecc71;

            align-items: center;
            justify-content: center;

        .social-icon-popup {

        .social-icon-popup.telegram svg { fill: #2AABEE; }
        .social-icon-popup.owner svg { fill: #2ecc71; }
    </style>

        }

        function getCurrentDateTime() {
            const now = new Date();
            return now.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });

Je m’appelle lord aziz et je vous écris aujourd’hui car je suis victime de harcèlement sérieux de la part d’un utilisateur. Je vous demande de bien vouloir traiter ce signalement avec la plus grande attention et le plus grand sérieux possible.

Je vous remercie sincèrement de prendre le temps d’examiner ce cas avec attention et de prendre les mesures qui s’imposent : suspension ou suppression définitive de ce compte afin qu’il ne puisse plus harceler qui que ce soit. Je compte vraiment sur votre intervention rapide pour me protéger et protéger les autres utilisateurs.

Je reste disponible pour vous fournir n’importe quelle information ou preuve supplémentaire dont vous auriez besoin.

Merci beaucoup pour votre aide et votre compréhension.`;

        function getUnbanMessage(phone, ip, dateTime) {
            return `Bonjour à l’équipe Support WhatsApp,

Je m’appelle lord aziz et je vous écris suite à la suspension de mon compte WhatsApp. Je respecte votre décision, mais je souhaite vous expliquer la situation en toute sincérité afin que vous puissiez réexaminer mon cas.

Dès que j’ai compris que mon compte avait été suspendu à cause de cela, j’ai immédiatement arrêté d’utiliser ce routeur. Je suis conscient maintenant que cela va contre les conditions d’utilisation de WhatsApp. Je m’engage à ne plus jamais utiliser de proxy, VPN, routeur ou tout autre outil qui pourrait modifier mon adresse IP ou mon comportement sur la plateforme.

J’utilise WhatsApp principalement pour communiquer avec ma famille, mes amis et pour mes besoins quotidiens. Cette suspension me cause beaucoup de difficultés et je regrette sincèrement d’avoir enfreint les règles, même involontairement.

Je vous demande gentiment de bien vouloir réexaminer mon compte et de lever la suspension si possible. Je ferai tout mon possible pour respecter scrupuleusement toutes les règles à l’avenir et éviter que cela se reproduise.

Je joins à ce mail toutes les informations utiles et je reste entièrement disponible pour fournir n’importe quel détail supplémentaire dont vous auriez besoin.

Merci infiniment pour le temps que vous prendrez pour lire ma demande et pour votre compréhension. J’apprécierais vraiment une seconde chance.

Cordialement,`;

        function createParticles() {
            const container = document.getElementById('bgParticles');
            for (let i = 0; i < 45; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.width = (Math.random() * 5 + 2) + 'px';
                p.style.height = p.style.width;
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.animationDuration = (Math.random() * 6 + 8) + 's';
                p.style.background = 'radial-gradient(circle, #2ecc71, #3498db)';
                container.appendChild(p);
            }
        }
        createParticles();

        const phoneInput = document.getElementById('phoneInput');
        const banTypeSelect = document.getElementById('banType');
        const sendBtn = document.getElementById('sendBtn');
        const methodRow = document.getElementById('methodButtonsRow');
        const mailBtn = document.getElementById('mailMethod');
        const waBtn = document.getElementById('whatsappMethod');

        function shake(el) { el.classList.add('error-shake'); setTimeout(() => el.classList.remove('error-shake'), 500); }

        sendBtn.onclick = () => {
            const phone = phoneInput.value.trim();
            const type = banTypeSelect.value;
            if (!phone) { shake(phoneInput); return; }
            if (!type) { shake(banTypeSelect); return; }
            methodRow.classList.remove('hidden');
        };

        waBtn.onclick = () => {
            const phone = phoneInput.value.trim();
            const type = banTypeSelect.value;
            if (!phone) { shake(phoneInput); return; }
            if (!type) { shake(banTypeSelect); return; }
            const msg = `Bonjour, je souhaite faire une demande de support pour un ${type === 'ban' ? 'signalement bannissement' : 'déblocage unban'}.%0A%0ANuméro : ${phone}%0A%0AMerci de bien vouloir examiner ma situation.`;
            window.open(`https://wa.me/22123456789?text=${msg}`, '_blank');
        };

        mailBtn.onclick = () => {
            const phone = phoneInput.value.trim();
            const type = banTypeSelect.value;
            if (!phone) { shake(phoneInput); return; }
            if (!type) { shake(banTypeSelect); return; }

            const ip = generateRandomIP();
            const dateTime = getCurrentDateTime();
            
            let subject = '';
            let body = '';
            
            if (type === 'ban') {
                subject = `URGENT SIGNALEMENT HARCÈLEMENT - ${phone}`;
                body = getBanMessage(phone, ip, dateTime);
            } else {
                subject = `DEMANDE DÉBLOCAGE UNBAN - ${phone}`;
                body = getUnbanMessage(phone, ip, dateTime);
            }
            
            const mailto = `mailto:${realSupportEmails.join(',')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailto;
        };

        phoneInput.onfocus = () => methodRow.classList.add('hidden');
        banTypeSelect.onchange = () => methodRow.classList.add('hidden');

        const floatBtn = document.getElementById('floatingSocialBtn');
        const popup = document.getElementById('socialPopup');
        floatBtn.onclick = () => { floatBtn.classList.toggle('active'); popup.classList.toggle('active'); };
        document.onclick = (e) => { if (!floatBtn.contains(e.target) && !popup.contains(e.target)) { floatBtn.classList.remove('active'); popup.classList.remove('active'); } };
    </script>
</body>
